---
doublestar: true
line_ending: lf

exclude: []
regex_exclude: []

formatter:
  type: basic
  indent: 2
  include_document_start: true
  pad_line_comments: 2
  retain_line_breaks_single: true
  scan_folded_as_literal: false
  trim_trailing_whitespace: true
  eof_newline: true
  force_quote_style: double
